<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MyGolf</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="theme-color" content="#1a7f37">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<header>
  <h1>MyGolf <button type="button" id="app-version" class="app-version-btn" title="変更履歴を表示"></button></h1>
  <span id="save-status" class="save-status"></span>
</header>
<div id="save-banner" class="banner" style="display:none"></div>

<main>
  <section id="screen-home" class="screen">
    <div id="home-body"></div>
  </section>

  <section id="screen-setup" class="screen" style="display:none"></section>

  <section id="screen-hole" class="screen" style="display:none"></section>

  <section id="screen-finish" class="screen" style="display:none">
    <div id="finish-body"></div>
  </section>

  <section id="screen-restore" class="screen" style="display:none"></section>

  <section id="screen-books" class="screen" style="display:none">
    <div id="books-body"></div>
  </section>

  <section id="screen-history" class="screen" style="display:none">
    <div id="history-body"></div>
  </section>

  <section id="screen-settings" class="screen" style="display:none">
    <div id="settings-body"></div>
  </section>
</main>

<nav class="tabbar">
  <button type="button" data-nav="home">ホーム</button>
  <button type="button" data-nav="setup">ラウンド設定</button>
  <button type="button" data-nav="hole">入力</button>
  <button type="button" data-nav="restore">復元</button>
  <button type="button" data-nav="settings">設定</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
